name: Source checks

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source scope, size and syntax
        run: python3 scripts/check_source.py
      - name: Check credential-free Colab CLI entrypoints
        run: |
          python3 colab/colab_mcp.py --help
          python3 colab/run_quantization.py --help
      - name: Scan complete public history and source tree
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --ignore-gitleaks-allow --log-opts="--all --full-history" .
          "$RUNNER_TEMP/gitleaks" dir --redact --ignore-gitleaks-allow .
          "$RUNNER_TEMP/gitleaks" git --redact --ignore-gitleaks-allow --log-opts="HEAD --full-history" upstream/lookatmyquant
          "$RUNNER_TEMP/gitleaks" dir --redact --ignore-gitleaks-allow methods/lookatmyquant
